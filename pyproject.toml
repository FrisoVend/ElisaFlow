[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "elisaflow"
version = "1.0"
description = "ElisaFlow: SkanIt ELISA analysis, calibration, quality control, and PDF reporting."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.15.2"
dependencies = ["numpy>=2.5", "pandas>=3.1", "scipy>=1.18", "reportlab>=4.0", "matplotlib>=3.11", "tzdata"]

[project.optional-dependencies]
ui = ["PySide6-Essentials>=6.12,<7"]
build = ["pyinstaller>=6.22.3"]
dev = ["ruff>=0.17.3", "pymupdf>=1.24"]
docs = ["sphinx>=8.1", "furo>=2024.8.6", "sphinx-mathjax-offline==0.0.2"]

[project.scripts]
elisaflow = "elisaflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elisaflow = ["assets/*.jpg", "assets/*.png", "assets/*.svg", "assets/*.ico"]

[tool.ruff]
target-version = "py315"
line-length = 150
extend-exclude = ["report_preview", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
